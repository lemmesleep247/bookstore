databaseChangeLog:
  - changeSet:
      id: 004-create-sequence-book-seq
      author: bookstore
      changes:
        - createSequence:
            sequenceName: book_seq
            incrementBy: 1
            startValue: 1
  - changeSet:
      id: 004-create-table-book-info
      author: bookstore
      changes:
        - createTable:
            tableName: book_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: authors
                  type: text[]
              - column:
                  name: copies
                  type: INT
              - column:
                  name: price
                  type: DOUBLE PRECISION
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_category
                    references: book_category_info(id)
              - column:
                  name: publisher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_publisher
                    references: book_publisher_info(id)
              - column:
                  name: valid_flag
                  type: CHAR(1)
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
