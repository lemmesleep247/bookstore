databaseChangeLog:
  - changeSet:
      id: 006-create-sequence-user-transaction-seq
      author: bookstore
      changes:
        - createSequence:
            sequenceName: user_transaction_seq
            incrementBy: 1
            startValue: 1
  - changeSet:
      id: 006-create-table-book-transaction-info
      author: bookstore
      changes:
        - createTable:
            tableName: book_transaction_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_book_transaction_order_id
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
              - column:
                  name: price
                  type: DOUBLE PRECISION
              - column:
                  name: valid_flag
                  type: CHAR(1)
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
