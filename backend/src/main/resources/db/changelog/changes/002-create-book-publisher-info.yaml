databaseChangeLog:
  - changeSet:
      id: 002-create-sequence-book-publisher-seq
      author: bookstore
      changes:
        - createSequence:
            sequenceName: book_publisher_seq
            incrementBy: 1
            startValue: 1
  - changeSet:
      id: 002-create-table-book-publisher-info
      author: bookstore
      changes:
        - createTable:
            tableName: book_publisher_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: address
                  type: VARCHAR(500)
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: valid_flag
                  type: CHAR(1)
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
