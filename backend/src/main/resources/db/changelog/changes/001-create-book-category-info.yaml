databaseChangeLog:
  - changeSet:
      id: 001-create-sequence-book-category-seq
      author: bookstore
      changes:
        - createSequence:
            sequenceName: book_category_seq
            incrementBy: 1
            startValue: 1
  - changeSet:
      id: 001-create-table-book-category-info
      author: bookstore
      changes:
        - createTable:
            tableName: book_category_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: valid_flag
                  type: CHAR(1)
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
